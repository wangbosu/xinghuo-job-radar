et="_blank" rel="noopener noreferrer" href="${esc(x.url)}">官方投递链接</a>`:''}<button class="save" data-save="${esc(x.id)}">${JSON.parse(localStorage.getItem('xinghuo-board')||'{}')[x.id]?'已加入投递看板':'加入投递看板'}</button></div></article>`}$('q').oninput=render;$('sort').onchange=render;const formalN=DATA.filter(formal).length;$('formalCount').textContent=formalN;$('leadCount').textContent=DATA.filter(x=>x.status==='lead').length;$('szCount').textContent=DATA.filter(x=>formal(x)&&x.location.includes('深圳')).length;$('soeCount').textContent=DATA.filter(x=>formal(x)&&x.tier).length;renderTabs();render();$('health').innerHTML=`<small>目录信源 ${(HEALTH.sources||[]).length} 个；本次入库 ${HEALTH.store_total||DATA.length} 条。${(HEALTH.sources||[]).filter(x=>x.status==='blocked'||x.status==='unstable').length} 个信源需关注。</small>`;</script></body></html>

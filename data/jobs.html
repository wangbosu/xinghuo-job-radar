ll';const $=id=>document.getElementById(id);function formal(x){return x.status==='verified'}function visible(x){if(current==='lead')return x.status==='lead';if(current==='all')return formal(x)&&x.new;if(current==='sz')return formal(x)&&x.location.includes('深圳');if(current==='gz')return formal(x)&&x.location.includes('广州');if(current==='cd')return formal(x)&&x.location.includes('成都');if(current==='soe')return formal(x)&&!!x.tier;if(current==='deadline')return formal(x)&&x.deadline&&x.deadline>='2026-09-17'&&x.deadline<='9999-12-31';if(current==='board')return (JSON.parse(localStorage.getItem('xinghuo-board')||'{}')[x.id]);return formal(x)&&x.role===current}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderTabs(){$('tabs').innerHTML=tabs.map(t=>`<button class="${current===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;renderTabs();render()})}function render(){let q=$('q').value.trim().toLowerCase();let arr=DATA.filter(visible).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));let sort=$('sort').value;if(sort==='deadline')arr.sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));if(sort==='new')arr.sort((a,b)=>Number(b.new)-Number(a.new)||b.score-a.score);$('list').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">当前栏目暂无符合条件的岗位</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let s=JSON.parse(localStorage.getItem('xinghuo-board')||'{}');s[b.dataset.save]=!s[b.dataset.save];localStorage.setItem('xinghuo-board',JSON.stringify(s));render()})}function card(x){let cls=x.status==='verified'?'verified':'lead';return `<article class="card"><span class="score">${x.score}</span><h3>${esc(x.title)}</h3><div class="company">${esc(x.company)} · ${esc(x.location||'地点待核')}</div><div class="meta">${esc(x.status_label)} · 发布 ${esc

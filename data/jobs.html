cument.getElementById(id);function formal(x){return x.status==='verified'}function visible(x){if(current==='lead')return x.status==='lead';if(current==='all')return formal(x)&&x.new;if(current==='sz')return formal(x)&&x.location.includes('深圳');if(current==='gz')return formal(x)&&x.location.includes('广州');if(current==='cd')return formal(x)&&x.location.includes('成都');if(current==='soe')return formal(x)&&!!x.tier;if(current==='deadline')return formal(x)&&x.deadline&&x.deadline>='2026-09-19'&&x.deadline<='9999-12-31';if(current==='board')return (JSON.parse(localStorage.getItem('xinghuo-board')||'{}')[x.id]);return formal(x)&&x.role===current}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderTabs(){$('tabs').innerHTML=tabs.map(t=>`<button class="${current===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;renderTabs();render()})}function render(){let q=$('q').value.trim().toLowerCase();let arr=DATA.filter(visible).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));let sort=$('sort').value;if(sort==='deadline')arr.sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));if(sort==='new')arr.sort((a,b)=>Number(b.new)-Number(a.new)||b.score-a.score);$('list').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">当前栏目暂无符合条件的岗位</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let s=JSON.parse(localStorage.getItem('xinghuo-board')||'{}');s[b.dataset.save]=!s[b.dataset.save];localStorage.setItem('xinghuo-board',JSON.stringify(s));render()})}function card(x){let cls=x.status==='verified'?'verified':'lead';return `<article class="card"><span class="score">${x.score}</span><h3>${esc(x.title)}</h3><div class="company">${esc(x.company)} · ${esc(x.location||'地点待核')}</div><div class="meta">${esc(x.status_label)} · 发布 ${esc(x.publish||'未知')} · 截止 ${esc(x.deadline||'未标注')}</div><span class="badge ${cls}">${esc(x.status_label)}</span><span class="badge">${esc(x.role)}</span>${x.tier?`<span class="badge verified">${esc(x.tier)}</span>`:''}<div class="meta">学历：${esc(x.education||'未标注')}　专业：${esc(x.major||'未标注')}<br>来源：${esc(x.source)}</div><div class="actions">${x.url?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">官方投递链接</a>`:''}<button class="save" data-save="${esc(x.id)}">${JSON.parse(localStorage.getItem('xinghuo-board')||'{}')[x.id]?'已加入投递看板':'加入投递看板'}</button></div></article>`}$('q').oninput=render;$('sort').onchange=render;const formalN=DATA.filter(formal).length;$('formalCount').textContent=formalN;$('leadCount').textContent=DATA.filter(x=>x.status==='lead').length;$('szCount').textContent=DATA.filter(x=>formal(x)&&x.location.includes('深圳')).length;$('soeCount').textContent=DATA.filter(x=>formal(x)&&x.tier).length;renderTabs();render();$('health').innerHTML=`<small>目录信源 ${(HEALTH.sources||[]).length} 个；本次入库 ${HEALTH.store_total||DATA.length} 条。${(HEALTH.sources||[]).filter(x=>x.status==='blocked'||x.status==='unstable').length} 个信源需关注。</small>`;</script></body></html>
